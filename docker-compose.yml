services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: plotter
      POSTGRES_PASSWORD: plotter_dev
      POSTGRES_DB: plotter_tool
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - plotter-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plotter -d plotter_tool"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://plotter:plotter_dev@db:5432/plotter_tool
      CACHE_DIR: /cache
    volumes:
      - ./backend:/app
      - ./cache:/cache
    networks:
      - plotter-net

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - plotter-net

volumes:
  postgres_data:

networks:
  plotter-net:
    driver: bridge
