<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-labelledby="title desc">
  <title id="title">PathToGCode emission flow</title>
  <desc id="desc">Diagram showing canonical path input flowing through motion planning into G-code output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#11161c" />
      <stop offset="100%" stop-color="#1d252f" />
    </linearGradient>
  </defs>
  <rect width="520" height="140" rx="10" fill="url(#bg)" stroke="#3a4654" />
  <rect x="24" y="30" width="132" height="80" rx="6" fill="#141b22" stroke="#6f7d8e" />
  <rect x="194" y="30" width="132" height="80" rx="6" fill="#141b22" stroke="#d18b19" />
  <rect x="364" y="30" width="132" height="80" rx="6" fill="#141b22" stroke="#48b86b" />
  <text x="90" y="57" fill="#cfd8e3" font-family="monospace" font-size="14" text-anchor="middle">PATH INPUT</text>
  <text x="90" y="80" fill="#8ea0b4" font-family="monospace" font-size="11" text-anchor="middle">segments + meta</text>
  <text x="260" y="57" fill="#f2c063" font-family="monospace" font-size="14" text-anchor="middle">MOTION PLAN</text>
  <text x="260" y="80" fill="#8ea0b4" font-family="monospace" font-size="11" text-anchor="middle">feeds, travel, arcs</text>
  <text x="430" y="57" fill="#79d69a" font-family="monospace" font-size="14" text-anchor="middle">GCODE OUTPUT</text>
  <text x="430" y="80" fill="#8ea0b4" font-family="monospace" font-size="11" text-anchor="middle">G0 / G1 / G2 / G3</text>
  <path d="M156 70 H194" stroke="#6f7d8e" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M326 70 H364" stroke="#d18b19" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cfd8e3" />
    </marker>
  </defs>
</svg>